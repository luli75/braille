<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f13">
<link rel="apple-touch-icon" href="icon.png">

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Braille App lista para instalar ✨'))
                .catch(err => console.log('Error al registrar service worker', err));
        });
    }
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braille Practice Studio - Perfect Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f13;
            color: #f3f4f6;
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .workspace {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            position: relative;
        }

        /* Menú lateral izquierdo con scroll nativo fluido */
        .nav-panel {
            background: #12181f;
            border-radius: 16px;
            padding: 16px;
            width: 220px;
            max-height: 92vh; /* Altura máxima optimizada para mantener todo a la vista */
            overflow-y: auto;  /* El scroll solo actúa si rebosa la pantalla */
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid #1e2630;
            position: absolute;
            left: 10px;
        }

        /* Estilo minimalista para la barra de scroll */
        .nav-panel::-webkit-scrollbar {
            width: 6px;
        }
        .nav-panel::-webkit-scrollbar-track {
            background: #12181f;
        }
        .nav-panel::-webkit-scrollbar-thumb {
            background: #283342;
            border-radius: 10px;
        }
        .nav-panel::-webkit-scrollbar-thumb:hover {
            background: #475a75;
        }

        .category-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .category-title {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4b5563;
            margin-bottom: 2px;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .char-btn {
            background: #1c242e;
            border: 1px solid #283342;
            color: #9ca3af;
            padding: 6px 0;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .char-btn:hover {
            background: #283342;
            color: #ffffff;
        }

        .char-btn.active-target {
            background: #6366f1;
            color: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        /* Tarjeta de práctica central */
        .trainer-card {
            background: #12181f;
            border-radius: 20px;
            padding: 24px;
            width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid #1e2630;
        }

        .display-wrapper {
            margin-bottom: 5px;
            text-align: center;
        }

        .target-display {
            font-size: 4.5rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            margin: 0;
        }

        .target-desc {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Caja de Braille */
        .braille-cell {
            display: grid;
            grid-template-columns: repeat(2, 54px);
            grid-gap: 16px;
            background: #171e27;
            padding: 20px;
            border-radius: 16px;
            margin: 15px auto;
            border: 1px solid #222c3a;
            width: fit-content;
        }

        .dot {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #2e3b4e;
            background-color: #1c242f;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .dot:hover {
            border-color: #475a75;
        }

        .dot.active {
            background-color: #6366f1; 
            border-color: #818cf8;
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.4);
        }

        .dot.revealed {
            border-color: #10b981 !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        /* Botonera */
        .control-panel {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 150px;
        }

        .btn-reveal {
            background: #1c242e;
            color: #9ca3af;
            border: 1px solid #283342;
        }

        .btn-reveal:hover {
            background: #283342;
            color: #f3f4f6;
        }

        .btn-reveal.active-toggle {
            background: #283342;
            color: #818cf8;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .feedback-message {
            font-size: 0.9rem;
            font-weight: 600;
            height: 20px;
            margin-top: 10px;
            text-align: center;
        }
        .correct { color: #10b981; }
        .info { color: #818cf8; }

        @media (max-width: 880px) {
            body { overflow: auto; height: auto; }
            .workspace { flex-direction: column-reverse; gap: 20px; padding-top: 20px; }
            .nav-panel { position: relative; left: auto; width: 100%; max-width: 420px; max-height: none; overflow-y: visible; }
            .char-grid { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
</head>
<body>

<div class="workspace">
    
    <div class="nav-panel">
        <div class="category-container">
            <div class="category-title">Letras (A-Z)</div>
            <div class="char-grid" id="letters-menu"></div>
        </div>
        <div class="category-container">
            <div class="category-title">Números</div>
            <div class="char-grid" id="numbers-menu"></div>
        </div>
        <div class="category-container">
            <div class="category-title">Signos y Modificadores</div>
            <div class="char-grid" id="symbols-menu"></div>
        </div>
        <div class="category-container">
            <div class="category-title">Vocales Modificadas</div>
            <div class="char-grid" id="modified-menu"></div>
        </div>
    </div>

    <div class="trainer-card">
        <div class="display-wrapper">
            <h2 class="target-display" id="target-char">A</h2>
            <div class="target-desc" id="target-desc">Letra A</div>
        </div>
        
        <div class="braille-cell">
            <div class="dot" id="dot1" onclick="toggleDot(1)"></div>
            <div class="dot" id="dot4" onclick="toggleDot(4)"></div>
            <div class="dot" id="dot2" onclick="toggleDot(2)"></div>
            <div class="dot" id="dot5" onclick="toggleDot(5)"></div>
            <div class="dot" id="dot3" onclick="toggleDot(3)"></div>
            <div class="dot" id="dot6" onclick="toggleDot(6)"></div>
        </div>

        <div class="control-panel">
            <button class="btn btn-reveal" id="reveal-btn" onclick="toggleRevealAnswer()">Ver respuesta</button>
        </div>
        
        <div id="feedback" class="feedback-message"></div>
    </div>

</div>

<script>
    const brailleDataset = {
        'A': { dots: [1], cat: 'letter', desc: 'Letra A' },
        'B': { dots: [1, 2], cat: 'letter', desc: 'Letra B' },
        'C': { dots: [1, 4], cat: 'letter', desc: 'Letra C' },
        'D': { dots: [1, 4, 5], cat: 'letter', desc: 'Letra D' },
        'E': { dots: [1, 5], cat: 'letter', desc: 'Letra E' },
        'F': { dots: [1, 2, 4], cat: 'letter', desc: 'Letra F' },
        'G': { dots: [1, 2, 4, 5], cat: 'letter', desc: 'Letra G' },
        'H': { dots: [1, 2, 5], cat: 'letter', desc: 'Letra H' },
        'I': { dots: [2, 4], cat: 'letter', desc: 'Letra I' },
        'J': { dots: [2, 4, 5], cat: 'letter', desc: 'Letra J' },
        'K': { dots: [1, 3], cat: 'letter', desc: 'Letra K' },
        'L': { dots: [1, 2, 3], cat: 'letter', desc: 'Letra L' },
        'M': { dots: [1, 3, 4], cat: 'letter', desc: 'Letra M' },
        'N': { dots: [1, 3, 4, 5], cat: 'letter', desc: 'Letra N' },
        'Ñ': { dots: [1, 2, 4, 5, 6], cat: 'letter', desc: 'Letra Ñ' },
        'O': { dots: [1, 3, 5], cat: 'letter', desc: 'Letra O' },
        'P': { dots: [1, 2, 3, 4], cat: 'letter', desc: 'Letra P' },
        'Q': { dots: [1, 2, 3, 4, 5], cat: 'letter', desc: 'Letra Q' },
        'R': { dots: [1, 2, 3, 5], cat: 'letter', desc: 'Letra R' },
        'S': { dots: [2, 3, 4], cat: 'letter', desc: 'Letra S' },
        'T': { dots: [2, 3, 4, 5], cat: 'letter', desc: 'Letra T' },
        'U': { dots: [1, 3, 6], cat: 'letter', desc: 'Letra U' },
        'V': { dots: [1, 2, 3, 6], cat: 'letter', desc: 'Letra V' },
        'W': { dots: [2, 4, 5, 6], cat: 'letter', desc: 'Letra W' },
        'X': { dots: [1, 3, 4, 6], cat: 'letter', desc: 'Letra X' },
        'Y': { dots: [1, 3, 4, 5, 6], cat: 'letter', desc: 'Letra Y' },
        'Z': { dots: [1, 3, 5, 6], cat: 'letter', desc: 'Letra Z' },
        
        '1': { dots: [1], cat: 'number', desc: 'Número 1' },
        '2': { dots: [1, 2], cat: 'number', desc: 'Número 2' },
        '3': { dots: [1, 4], cat: 'number', desc: 'Número 3' },
        '4': { dots: [1, 4, 5], cat: 'number', desc: 'Número 4' },
        '5': { dots: [1, 5], cat: 'number', desc: 'Número 5' },
        '6': { dots: [1, 2, 4], cat: 'number', desc: 'Número 6' },
        '7': { dots: [1, 2, 4, 5], cat: 'number', desc: 'Número 7' },
        '8': { dots: [1, 2, 5], cat: 'number', desc: 'Número 8' },
        '9': { dots: [2, 4], cat: 'number', desc: 'Número 9' },
        '0': { dots: [2, 4, 5], cat: 'number', desc: 'Número 0' },
        
        '¡!': { dots: [2, 3, 5], cat: 'symbol', desc: 'Exclamación' },
        '¿?': { dots: [2, 6], cat: 'symbol', desc: 'Interrogación' },
        '.': { dots: [3], cat: 'symbol', desc: 'Punto final' },
        ',': { dots: [2], cat: 'symbol', desc: 'Coma' },
        ':': { dots: [2, 5], cat: 'symbol', desc: 'Dos puntos' },
        ';': { dots: [2, 3], cat: 'symbol', desc: 'Punto y coma' },
        '""': { dots: [2, 3, 6], cat: 'symbol', desc: 'Comillas' },
        '()': { dots: [1, 2, 6], cat: 'symbol', desc: 'Paréntesis' },
        '-': { dots: [3, 6], cat: 'symbol', desc: 'Guion' },
        '#': { dots: [3, 4, 5, 6], cat: 'symbol', desc: 'Prefijo Número' },
        '⇧': { dots: [4, 6], cat: 'symbol', desc: 'Prefijo Mayúscula' },

        'Á': { dots: [1, 2, 3, 5, 6], cat: 'modified', desc: 'Vocal Á con tilde' },
        'É': { dots: [2, 3, 4, 6], cat: 'modified', desc: 'Vocal É con tilde' },
        'Í': { dots: [3, 4], cat: 'modified', desc: 'Vocal Í con tilde' },
        'Ó': { dots: [3, 4, 6], cat: 'modified', desc: 'Vocal Ó con tilde' },
        'Ú': { dots: [2, 3, 4, 5, 6], cat: 'modified', desc: 'Vocal Ú con tilde' },
        'Ü': { dots: [1, 2, 5, 6], cat: 'modified', desc: 'Vocal Ü con diéresis' }
    };

    const orderedNumbers = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];

    const keysSequence = [
        ...Object.keys(brailleDataset).filter(k => brailleDataset[k].cat === 'letter'),
        ...orderedNumbers,
        ...Object.keys(brailleDataset).filter(k => brailleDataset[k].cat === 'symbol'),
        ...Object.keys(brailleDataset).filter(k => brailleDataset[k].cat === 'modified')
    ];
    
    let currentKey = 'A';
    let activeDots = new Set();
    let isTransitioning = false;
    let isShowingAnswer = false;

    function buildMenus() {
        const lettersGrid = document.getElementById('letters-menu');
        const numbersGrid = document.getElementById('numbers-menu');
        const symbolsGrid = document.getElementById('symbols-menu');
        const modifiedGrid = document.getElementById('modified-menu');

        keysSequence.forEach(key => {
            const val = brailleDataset[key];
            const btn = document.createElement('button');
            btn.className = `char-btn btn-${key}`;
            btn.innerText = key;
            btn.onclick = () => selectCharacter(key);
            
            if (val.cat === 'letter') lettersGrid.appendChild(btn);
            else if (val.cat === 'number') numbersGrid.appendChild(btn);
            else if (val.cat === 'symbol') symbolsGrid.appendChild(btn);
            else if (val.cat === 'modified') modifiedGrid.appendChild(btn);
        });
        
        updateActiveMenuHighlight();
        selectCharacter('A');
    }

    function selectCharacter(key) {
        currentKey = key;
        resetGrid();
        resetRevealButton();
        document.getElementById('target-char').innerText = key;
        document.getElementById('target-desc').innerText = brailleDataset[key].desc;
        document.getElementById('feedback').innerText = "";
        updateActiveMenuHighlight();
        isTransitioning = false;
    }

    function updateActiveMenuHighlight() {
        document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active-target'));
        const activeBtn = document.querySelector(`.char-btn.btn-${CSS.escape(currentKey)}`);
        if (activeBtn) activeBtn.classList.add('active-target');
    }

    function toggleDot(dotNumber) {
        if (isTransitioning) return;
        
        if (isShowingAnswer) {
            resetRevealButton();
            resetGrid();
        }
        
        document.querySelectorAll('.dot').forEach(d => d.classList.remove('revealed'));
        
        const dotElement = document.getElementById(`dot${dotNumber}`);
        if (activeDots.has(dotNumber)) {
            activeDots.delete(dotNumber);
            dotElement.classList.remove('active');
        } else {
            activeDots.add(dotNumber);
            dotElement.classList.add('active');
        }

        checkAnswerAuto();
    }

    function checkAnswerAuto() {
        const correctDots = brailleDataset[currentKey].dots;
        const feedbackDiv = document.getElementById('feedback');

        const isCorrect = correctDots.length === activeDots.size && 
                          correctDots.every(dot => activeDots.has(dot));

        if (isCorrect) {
            isTransitioning = true;
            resetRevealButton();
            feedbackDiv.className = "feedback-message correct";
            feedbackDiv.innerText = "¡Excelente! ✨";
            
            setTimeout(() => {
                let idx = keysSequence.indexOf(currentKey);
                idx = (idx + 1) % keysSequence.length;
                selectCharacter(keysSequence[idx]);
            }, 1000);
        } else {
            if(feedbackDiv.className === "feedback-message info") {
                feedbackDiv.innerText = "";
            }
        }
    }

    function toggleRevealAnswer() {
        if (isTransitioning) return;
        
        const revealBtn = document.getElementById('reveal-btn');
        const feedbackDiv = document.getElementById('feedback');

        if (!isShowingAnswer) {
            resetGrid();
            const correctDots = brailleDataset[currentKey].dots;
            
            correctDots.forEach(dot => {
                const dotElement = document.getElementById(`dot${dot}`);
                dotElement.classList.add('active', 'revealed');
                activeDots.add(dot);
            });
            
            feedbackDiv.className = "feedback-message info";
            feedbackDiv.innerText = "Mostrando combinación correcta 💡";
            
            revealBtn.innerText = "Ocultar respuesta";
            revealBtn.classList.add('active-toggle');
            isShowingAnswer = true;
        } else {
            resetGrid();
            resetRevealButton();
            feedbackDiv.innerText = "";
        }
    }

    function resetRevealButton() {
        const revealBtn = document.getElementById('reveal-btn');
        revealBtn.innerText = "Ver respuesta";
        revealBtn.classList.remove('active-toggle');
        isShowingAnswer = false;
    }

    function resetGrid() {
        activeDots.clear();
        document.querySelectorAll('.dot').forEach(dot => {
            dot.classList.remove('active', 'revealed');
        });
    }

    buildMenus();
</script>

</body>
</html>
